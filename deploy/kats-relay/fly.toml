# 국표원 조회 경유지 — 본체(`sourcing-guard`)와 **다른 앱**이다.
#
# 본체는 nrt 에 그대로 있다. 이 앱은 sin 에서 조회만 중계한다.

app = "sgkatsrelay"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# 공개 IP 를 두지 않는다.
#
# `[http_service]` / `[[services]]` 를 **일부러 비워 뒀다.** 있으면 fly 가
# 공개 IP 를 붙이고, 그러면 남이 우리 키로 국표원을 칠 수 있는 프록시가 된다.
# 본체는 fly 사설망(6PN)으로 `http://sgkatsrelay.internal:8080` 을 부른다 -
# 같은 조직 안에서만 닿는다.
#
# 확인: `fly ips list -a sgkatsrelay` 가 비어 있어야 한다.

# 볼륨 없음. 저장하는 것이 없다.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
