# Fly.io 배포 설정 — 안심 소싱 돋보기
#
# 앱 이름은 `fly launch` 가 생성한 값으로 바꿔야 한다. 아래는 자리표시자다.
app = "sourcing-guard"
primary_region = "nrt"          # 도쿄. 서울(icn)은 지역에 따라 미제공일 수 있다.

[build]
  dockerfile = "Dockerfile"

[env]
  # 2026-09-01 인증키 수령으로 실연동 전환. 키는 secrets 로 넣는다.
  MOCK_MODE = "false"
  # ⚠ 반드시 영구 볼륨 경로. 컨테이너 기본 파일시스템에 두면 재배포마다
  #   워치리스트가 사라지고, "리콜 공표되면 가장 먼저 알린다"는 이 서비스의
  #   유일한 약속이 조용히 깨진다 (기획서 §6.1).
  #
  #   리콜 로컬 사본(37,313건, 약 59MB)도 이 DB 의 recalls 테이블에 들어간다.
  #   별도 RECALL_DB_PATH 를 두려던 초안이 있었으나 구현은 한 DB 로 갔다 —
  #   워치리스트 스윕이 리콜을 조인해서 읽으므로 나눌 이유가 없었다.
  WATCHLIST_DB_PATH = "/data/watchlist.db"
  # 리콜 일일 동기화. 시작 시 1회 + 하루 한 번.
  SYNC_ENABLED = "true"

# 영구 볼륨. 워치리스트 + 리콜 동기화 DB 양쪽이 여기 들어간다.
# 생성: fly volumes create sg_data --region nrt --size 3
[[mounts]]
  source = "sg_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # ⚠ 슬립 금지. 9/20~10/7 투표 기간 18일간 무중단이어야 하고, 깨어나는 데
  #   30초~1분 걸리면 투표자가 그냥 닫는다 (기획서 §8: 캐시 히트 3초 이내).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  # /healthz 는 목 모드 여부·규칙 개수와 함께 watched_items 를 돌려주는데,
  # 이 값을 세려면 SQLite 를 실제로 읽어야 한다. 즉 볼륨이 안 붙었으면
  # 헬스체크가 실패한다 — 배포 사고를 조용히 넘기지 않는다.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
