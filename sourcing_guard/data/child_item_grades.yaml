# 어린이제품 세부품목 등급표.
#
# 「어린이제품 안전 특별법 시행규칙」 별표 1~3 을 그대로 옮긴 것이다.
# 별표 1 이 안전인증, 2 가 안전확인, 3 이 공급자적합성확인 대상이다.
#
# ⚠ **판정에 연결되어 있다.** `ItemGradeBook` 이 item_grades.yaml 과 **같은
#   색인에** 넣어 읽는다(item_grades.py `__init__` 주석에 합칠 때의 충돌
#   실측이 있다 - 이름이 같은데 등급이 다른 행 0건).
#
#   ⚠ 2026-09-14 에 이 자리를 고쳤다. 전에는 "아직 판정에 연결하지 않았다" 로
#     적혀 있었는데 **연결된 뒤에 갱신되지 않아 거짓이 됐다.** 이 표를 읽는
#     사람이 "그럼 화면에 안 나오겠구나" 로 읽는다 - 문서가 코드보다 앞서
#     나가는 것과 같은 비용이다.
#
# ⚠ 이 표의 행은 자기 `source` 를 근거로 들고 화면까지 간다. verifier 가
#   `_GRADE_LAW_URLS` 로 법령별 원문 주소를 찾으므로, **새 법령 이름을 이
#   파일에 넣을 때는 그 표에도 주소를 넣는다** (검사가 막는다).
#
# ⚠ 스키마는 item_grades.yaml 과 같다. 다만 category 값 'children' 은
#   ItemCategory 에 없다 - 거기엔 CHILDREN_TOY/STATIONERY/TEXTILE 셋만 있고
#   총칭이 없다. 색인이 문자열로만 쓰므로 지금은 문제가 없다. enum 을 늘리면
#   추출 프롬프트까지 건드리게 되고, 재봐야 아는 것을 미리 설계하는 셈이 된다.
#
# 생성: scripts/parse_child_item_grades.py

# 목록에 없는 어린이제품이 어디로 가는지. 주석이 아니라 필드로 둔다 -
# 화면이 이 문장을 그대로 쓸 수 있어야 한다.
#
# 전기·생활용품에서는 '표에 없음 = 비대상' 이 성립하지 않는다는 것을
# 우리가 추론해야 했지만, 어린이제품은 원문이 명시한다. 그래서 목록에
# 없어도 '판별 못 함' 이 아니라 확정된 답을 줄 수 있다.
catch_all:
  applies_to: 어린이제품
  grade: 공급자적합성확인
  standard: 어린이제품 공통안전기준
  source: "어린이제품 안전 특별법 시행규칙 별표 3 제2호"
  source_text: "개별 안전기준이 없는 공급자적합성확인대상어린이제품은 어린이제품 공통안전기준을 적용한다."
  statement_ko: "목록에 없는 어린이제품도 안전관리 대상에서 빠지지 않습니다. 개별 안전기준이 없으면 어린이제품 공통안전기준이 적용되는 공급자적합성확인 대상입니다."

