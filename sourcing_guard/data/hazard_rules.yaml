# 커버리지 선언: 여기에 없는 품목군은 COVERAGE_GAP 으로 처리되어 UNKNOWN 이 됩니다.
# 선언만으로는 부족하고 해당 품목군에 verified 룰이 최소 1건 있어야 커버로 칩니다.
  # ==========================================================================
  # 안전확인 안전기준 부속서 1 - 유아용 섬유제품 (36개월 미만)
  #
  # 공통안전기준보다 **엄격하다.** 폼알데하이드가 대표적으로 공통 75 -> 20 이다.
  # 개별 안전기준이 있는 품목에 공통기준을 적용하면 셀러에게 실제보다 느슨한
  # 값을 보여주게 된다 - "모른다" 가 아니라 "틀렸다" 라서 더 나쁘다.
  #
  # 그리고 공통안전기준에 **아예 없는 물질이 6종** 있다: 유기주석(DBT/TBT),
  # 방염제, 알러지성 염료, 니켈 용출량, 노닐페놀.
  #
  # 적용범위 단서 (부속서 1, 1항):
  #   - 36개월 미만 영·유아용 섬유제품
  #   - 맞춤복은 안전확인대상에서 제외
  #   - **놀이용 가장복은 부속서 6(완구)** 으로 간다
  #   - 가죽·모피 부분은 공급자적합성확인 부속서 1(어린이용 가죽제품) 적용.
  #     단 면적 5% 이하 또는 전체 중량 1% 미만이면 이 기준을 적용한다.
  # ==========================================================================
  - id: KC-ANNEX1-TEXTILE-HCHO
    substance: 폼알데하이드
    aliases: [formaldehyde, 포름알데히드, 폼알데히드, 甲醛]
    applies_to: [children_textile]
    limit_value: 20
    unit: mg/kg
    clause: "5.2 유해물질 안전요건 [표 2]"
    source_page: 3
    condition: "36개월 미만 영·유아용 섬유제품. 섬유부분에 한하여 적용(주 1)"
    test_method: "KS K ISO 14184-1 (6.2.1)"
    legal_basis: "안전확인 안전기준 부속서 1(유아용 섬유제품) 5.2"
    source_url: "https://www.law.go.kr/행정규칙/안전확인대상어린이제품의안전기준"
    status: draft
    verified_by: null
    verified_at: null
    note: >-
      공통안전기준 3.1.5 는 75 mg/kg 이다. 개별기준이 있으므로 이쪽이 우선하며,
      3.75배 엄격하다. 공통기준을 적용하면 느슨한 값을 보여주게 된다.

