  # ==========================================================================
  # 성능·구조 안전요건 (생활용품·전기용품)
  #
  # 유해물질과 담는 방식이 다르다. 부속서 53(운동용 안전모) 원문을 보면 기준이
  # "가속도계를 무게중심 반경 10mm 이내에 설치하고 6kHz 로 샘플링해 CFC 1000
  # 으로 필터링" 같은 **시험 절차 규격**이다. 값을 보여줘야 셀러가 쓸 수 없다.
  #
  # 그래서 값 대신 **어떤 시험을 통과해야 하는지**(test_items)와, 정부 조사에서
  # 이 품목이 어떻게 나왔는지(failure_rate)를 담는다. 화면에서 하는 일은
  # 유해물질과 같다 - "이걸 확인하라" 는 안내다.
  #
  # ⚠ failure_rate 는 비율만 두지 않는다. "88%" 만 적으면 표본 8개짜리가 통계
  #   처럼 읽힌다. sample 과 source 를 반드시 함께 담는다
  #   (tests/test_failure_rate_honesty.py 가 강제한다).
  #
  # ⚠ 아래 셋은 **부속서 번호와 시험 항목이 원문 미확인**이다. 부적합률만
  #   정부 보도자료로 확인했다. 원문을 받으면 test_items·annex_no·clause 를
  #   채우고 승격한다. 지금은 구조 증명용 draft 다.
  # ==========================================================================
