    test_method: "KS G ISO 8124-3 (4.1.1)"
    legal_basis: "어린이제품 공통안전기준 3.1.1 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
    status: verified
    verified_by: "박수범"
    verified_at: "2026-09-02"

  # --- 3.1.2 유해원소 함유량 (원문 p.3) -----------------------------------
  # 시험방법 4.1.2: 부록 A 로 시험시료 준비 후 부록 B
  - id: KC-COMMON-3.1.2-PB
    substance: "총 납(함유량)"
    aliases: ["Pb", "lead", "총 납", "铅"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 100
    unit: "mg/kg"
    clause: "3.1.2 유해원소 함유량"
    source_page: 3
    condition: >-
      페인트 및 표면코팅의 경우 90 mg/kg 이하로 적용. 다만 전기·전자제품의 기능성
      부품(전기연결용 소자 등)과 필기구의 팁이 금속인 경우에는 적용하지 않는다.
      섬유원단에는 적용하지 않는다.
    limit_variants:
      - value: 100
        unit: "mg/kg"
        applies: "일반"
      - value: 90
        unit: "mg/kg"
        applies: "페인트 및 표면코팅"
    exclusions: ["섬유원단", "전기·전자제품의 기능성 부품(전기연결용 소자 등)", "필기구의 금속 팁"]
    test_method: "부록 A(시료준비) + 부록 B (4.1.2)"
    legal_basis: "어린이제품 공통안전기준 3.1.2 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
    status: verified
    verified_by: "박수범"
    verified_at: "2026-09-02"

  - id: KC-COMMON-3.1.2-CD
    substance: "총 카드뮴(함유량)"
    aliases: ["Cd", "cadmium", "총 카드뮴", "镉"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 75
    unit: "mg/kg"
    clause: "3.1.2 유해원소 함유량"
    source_page: 3
    condition: "섬유원단에는 적용하지 않는다."
    exclusions: ["섬유원단"]
    test_method: "부록 A(시료준비) + 부록 B (4.1.2)"
    legal_basis: "어린이제품 공통안전기준 3.1.2 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
    status: verified
    verified_by: "박수범"
    verified_at: "2026-09-02"

  # --- 3.1.3 프탈레이트계 가소제 (원문 p.3) -------------------------------
  # 6종의 "총 합" 이 0.1 % 이하. 물질별 개별 한도가 아니다.
  # 시험방법 4.1.3: 부록 C (원문 p.8). 분석기법은 부록 본문에 있고 미확보다.
  - id: KC-COMMON-3.1.3-PHT
    substance: "프탈레이트계 가소제"
    aliases:
      ["phthalate", "프탈레이트", "가소제", "邻苯二甲酸酯",
       "DEHP", "DBP", "BBP", "DINP", "DIDP", "DnOP", "DIBP", "PVC"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 0.1
    unit: "%"
    limit_basis: "7종의 총 합"
    clause: "3.1.3 프탈레이트계 가소제"
    source_page: 3
    condition: "합성수지제(섬유 또는 가죽 등에 코팅된 것을 포함)에 적용한다."
    substances_covered:
      - {name: "DEHP", full: "Di-(2-ethylhexyl) phthalate", cas: "117-81-7"}
      - {name: "DBP",  full: "Dibutyl phthalate",           cas: "84-74-2"}
      - {name: "BBP",  full: "Benzyl butyl phthalate",      cas: "85-68-7"}
      - {name: "DINP", full: "Diisononyl phthalate",        cas: "28553-12-0 또는 68515-48-0"}
      - {name: "DIDP", full: "Diisodecyl phthalate",        cas: "26761-40-0 또는 68515-49-1"}
      - {name: "DnOP", full: "Di-n-octyl phthalate",        cas: "117-84-0"}
      # DIBP 는 2022-12-14 개정에서 추가됐다. 현행 제2022-220호 p.3 표에서
      # 원문 확인 완료 (2026-09-01). 2020년판(제2019-201호)은 6종이었다.
      - {name: "DIBP", full: "Diisobutyl phthalate",         cas: "84-69-5"}
    # 원문 p.8 4.1.3 은 "부록 C에 따른다" 뿐이다. 분석기법(GC-MS)은 이 고시
    # 본문에 없다 — 부록 C 는 확보한 9쪽 PDF 에 포함돼 있지 않으므로,
    # 기법을 적으려면 부록을 확보한 뒤에 한다 (CLAUDE.md R5).
    test_method: "부록 C (4.1.3)"
    legal_basis: "어린이제품 공통안전기준 3.1.3 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
    status: verified
    verified_by: "박수범"
    verified_at: "2026-09-02"
    note: >-
      "DnOP·DINP·DIDP 는 입에 넣도록 의도된 완구에 한정" 은 옛 완구 부속서
      조항이며 삭제됐다. 현행 3.1.3 은 7종을 구분 없이 총합 0.1 % 로 규제하고,
      재질(합성수지제) 기준으로만 적용된다.

  # --- 3.1.4 니트로사민류 (원문 p.4) --------------------------------------
  # 한도가 적용대상에 따라 두 값으로 갈린다. 원문 각주 1)/2) 참조.
  - id: KC-COMMON-3.1.4-NITROSAMINE
    substance: "니트로사민류"
    aliases: ["nitrosamine", "니트로사민", "N-니트로소"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 0.01
    unit: "mg/kg"
    limit_basis: "7종의 총 합"
    clause: "3.1.4 니트로사민류 및 니트로사민류 생성 가능물질"
    source_page: 4
    condition: "탄성중합체(elastomer) 부분에 한해 적용"
    limit_variants:
      - value: 0.01
        unit: "mg/kg"
        applies: "입에 넣어 사용할 용도로 제작된 36개월 미만 어린이제품의 탄성중합체(예: 노리개 젖꼭지, 치발기, 칫솔)"
      - value: 0.05
