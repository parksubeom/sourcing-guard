  - id: KC-COMMON-3.1.1-PB
    substance: "납(용출)"
    aliases: ["Pb", "lead", "铅"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 90
    unit: "mg/kg"
    clause: "3.1.1 유해원소 용출"
    source_page: 2
    condition: "입에 넣어 사용할 용도로 제작된 어린이제품, 또는 36개월 미만이 사용할 어린이제품 중 도장면(코팅 포함)·합성수지제·종이제"
    test_method: "KS G ISO 8124-3 (4.1.1)"
    legal_basis: "어린이제품 공통안전기준 3.1.1 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
    status: verified
    verified_by: "박수범"
    verified_at: "2026-09-02"
    note: >-
      ⚠ 기획서 §2.3·§4 와 이전 draft 가 "납 300 mg/kg" 이라고 적고 있으나
      이 고시에는 300 이라는 값이 없다. 용출 90, 함유량 100(페인트·표면코팅 90)이다.
      기획서 문구를 고치거나, 300 의 출처(다른 부속서/구버전/해외기준)를 확인해야 한다.

  - id: KC-COMMON-3.1.1-HG
    substance: "수은"
    aliases: ["Hg", "mercury", "汞"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 60
    unit: "mg/kg"
    clause: "3.1.1 유해원소 용출"
