    test_method: "KS G ISO 8124-3 (4.1.1)"
    legal_basis: "어린이제품 공통안전기준 3.1.1 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
