# 자체 구축 유해물질 규칙 DB
#
# 이 파일이 프로젝트의 핵심 자산입니다. 유해물질 기준치를 제공하는 공공 API 는
# 존재하지 않으며, 국가기술표준원 고시·부속서를 파싱해 구조화한 것입니다.
#
# 규정 (CLAUDE.md §5):
#   - status: draft  → LLM 이 문서에서 뽑은 초안. 스코어링에서 제외됨.
#   - status: verified → 사람이 원문 대조를 마침. 이때만 프로덕션 반영.
#   - limit_value 와 legal_basis 는 원문 표기 그대로. 단위 환산은 코드에서.
#
# 검수 방법: docs/규칙DB_검수목록.md 의 표를 원문 PDF 와 한 줄씩 대조하세요.
# 원문: docs/어린이제품_공통안전기준_2020-06-04시행.pdf
#
# ⚠ 기준치 하나를 잘못 넣으면 셀러에게 틀린 숫자를 보여주게 되고, 그것이 이
#   서비스에서 가장 비싼 오류입니다. draft 상태에서는 스코어링에 반영되지 않으니
#   서두르지 말고 대조하세요.

meta:
  schema_version: 2
  note: "draft 룰은 scorer 에 반영되지 않습니다."
  sources:
    - id: KC-COMMON-2022-220
      title: "어린이제품 공통안전기준"
      decree: "산업통상자원부고시 제2022-220호 (2022.12.14. 일부개정, 2023.4.1. 시행)"
      effective: "2020-06-04"
      url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
      local_copy: "docs/어린이제품_공통안전기준_2020-06-04시행.pdf"
      scope_note: >-
        만 13세 이하 어린이가 사용하거나 어린이를 위하여 사용되는 물품과 그
        부분품·부속품에 공통 적용(1. 적용범위, p.1). 개별 안전기준이 있는
        제품은 개별 기준과 공통기준을 모두 적용한다. 즉 이 고시의 룰은
        완구·학용품·아동용 섬유제품 세 품목군에 모두 걸린다.

# ---------------------------------------------------------------------------
# 3.1 유해화학물질 안전요건
# ---------------------------------------------------------------------------
rules:

  # --- 3.1.1 유해원소 용출 (원문 p.3) -------------------------------------
  # 비고: 입에 넣어 사용할 용도로 제작된 어린이제품, 혹은 36개월 미만이 사용할
  #       어린이제품 중 제품의 도장면(코팅 포함) 또는 합성수지제, 종이제에 적용
  # 시험방법 4.1.1: KS G ISO 8124-3 (완구의 안전성-제3부: 특정 원소의 용출)
  - id: KC-COMMON-3.1.1-SB
    substance: "안티모니"
    aliases: ["Sb", "antimony", "안티몬", "锑"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 60
    unit: "mg/kg"
    clause: "3.1.1 유해원소 용출"
    source_page: 2
    condition: "입에 넣어 사용할 용도로 제작된 어린이제품, 또는 36개월 미만이 사용할 어린이제품 중 도장면(코팅 포함)·합성수지제·종이제"
    test_method: "KS G ISO 8124-3 (4.1.1)"
    legal_basis: "어린이제품 공통안전기준 3.1.1 (산업통상자원부고시 제2022-220호)"
    source_url: "https://www.law.go.kr/행정규칙/어린이제품공통안전기준"
    status: verified
    verified_by: "박수범"
    verified_at: "2026-09-02"

  - id: KC-COMMON-3.1.1-AS
    substance: "비소"
    aliases: ["As", "arsenic", "砷"]
