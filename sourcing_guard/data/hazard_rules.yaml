  - id: KC-COMMON-3.1.1-CR
    substance: "크로뮴"
    aliases: ["Cr", "chromium", "크롬", "铬"]
    applies_to: [children_toy, children_stationery, children_textile]
    limit_value: 60
    unit: "mg/kg"
    clause: "3.1.1 유해원소 용출"
    source_page: 2
    condition: "입에 넣어 사용할 용도로 제작된 어린이제품, 또는 36개월 미만이 사용할 어린이제품 중 도장면(코팅 포함)·합성수지제·종이제"
    test_method: "KS G ISO 8124-3 (4.1.1)"
    legal_basis: "어린이제품 공통안전기준 3.1.1 (산업통상자원부고시 제2022-220호)"
