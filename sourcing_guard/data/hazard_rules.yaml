  # ==========================================================================
  # 안전확인 안전기준 부속서 6 - 완구, 제4부 유해화학물질
  #
  # 공통안전기준과 **구조가 다르다.** 공통은 유해원소 8종에 값 하나씩이지만,
  # 완구는 19종에 재질 카테고리별로 값이 셋이다(원문 p.105 [표 4-2]).
  # 그리고 훨씬 엄격하다 - 납이 공통 90 인데 완구는 카테고리 2 에서 3.4 다.
  #
  # 카테고리는 재질로 정해진다 (p.104 [표 4-1]) - 우리가 이미 추출하는 값이다:
  #   1  크레용·색연필 심·분필, 점토·석고 (고체 형태로 흔적을 남기는 재료)
  #   2  액체 페인트·잉크·슬라임·비눗방울 용액, 고체 풀
  #   3  코팅·고분자·종이·섬유·유리/세라믹/금속·나무 (대부분이 여기)
  #
  # limit_value 에는 **카테고리 2(가장 엄격)** 를 둔다. 셀러가 재질을 안 적었을
  # 때 느슨한 값을 보여주면 안 되기 때문이다. 재질이 확인되면 category_limits
  # 에서 해당 값을 쓴다.
  # ==========================================================================

