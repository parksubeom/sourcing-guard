  # ==========================================================================
  # 안전확인 안전기준 부속서 11 - 학용품
  #
  # 부속서 1(섬유)과 달리 **대부분 공통기준과 같다.** 유해원소 용출 8종, 총 납
  # 100, 총 카드뮴 75 가 그대로이고, 프탈레이트는 아예 "어린이제품 공통안전기준에
  # 따름" 으로 위임한다. 그래서 중복 룰을 만들지 않는다.
  #
  # 공통기준과 **다른 것만** 담는다:
  #   - 폼알데하이드가 잉크류 20 / 문구용 풀 0.1% 로 갈린다 (공통 75 는 섬유 전용)
  #   - pH 가 4.0~8.0 (공통 4.0~7.5 보다 상한이 넓다 - 액상풀 한정)
  #   - 향료·급성경구독성·유전독성은 크레용·크레파스·지우개에만 걸린다
  # ==========================================================================
