# 지재권 표기어 — [L-2] · 2026-09-14
#
# ⚠⚠ **판정이 아니다. 안내 축이다.**
#   신호등을 바꾸지 않는다 · 등급을 붙이지 않는다 · 다섯 숫자를 움직이지 않는다.
#   문구는 "'…' 표기가 있습니다. 상표·디자인권은 이 도구가 확인하지 않습니다 —
#   권리자·KIPRIS 확인 필요" 까지다.
#
# ⚠⚠ **브랜드명 사전을 만들지 않는다 (R5).** 우리가 가진 것은 "호환·st 같은
#   말이 상세페이지에 적혀 있다" 는 사실뿐이고, 그 말이 **누구의 권리를
#   건드리는지는 우리가 판단할 수 있는 것이 아니다.** 브랜드 목록을 만들면
#   그 순간 "이 상품은 상표권을 침해한다" 를 우리가 말하는 셈이 된다.
#
# ⚠ 이 파일은 **텍스트 편집만** 한다. `yaml.safe_dump` 으로 덮어쓰지 않는다 -
#   주석이 자산이다 (CLAUDE.md §6).
#
# ── 크레파스 원칙: 실측에서 걸린 것만 ──────────────────────────────
#
# 표지어는 별칭과 같은 성질이다 — 매칭을 넓힌다. 그래서 후보를 넓게 던지고
# **실제로 걸린 것만** 남겼다. 걸린 수와 오탐 예를 같이 적는다.
#
# 코퍼스 (2026-09-14 · 합계 19,173줄)
#   도매꾹 제목 18,938  tests/fixtures/도매꾹_표본_2026-09-12/상품명.tsv
#   새표본      235     tests/fixtures/새표본235.txt
#
# 던진 후보 13개 중 **둘만 남았다.** 버린 열하나와 이유:
#
#   스타일      46   "프리스타일 헌팅캡" · "청바지 스타일" · "슬라치 스타일"
#                    — 옷차림을 말하는 보통 낱말이지 브랜드 모방 표기가 아니다
#   리퍼         9   "네일클리퍼" · "바나나 리퍼블릭" — 전부 다른 낱말의 조각
#   st (띄고)    4   "ST-8000" · "ST GL003S" · "ST-400HD" 가 3/4 — 모델 번호다
#                    ("이케아 st" 하나만 진짜였다. 4분의 1은 못 쓴다)
#   모조         3   "모조지"(종이) · "비트코인 모조 돈"(기념주화) — 상표가 아니다
#   이미테이션    1   "샤크 이미테이션 안테나" — 더미 안테나라는 제품 종류다
#   유사품       1   "(유사품주의" — 셀러가 **자기 제품의 짝퉁을 경고**하는 말이다.
#                    방향이 반대라 안내를 붙이면 엉뚱한 말을 하게 된다
#   대체품       1   "립틴트대체품" — 품목 대체이지 브랜드가 아니다
#   카피         0   ("카피바라" 29건을 빼면 0)
#   레플리카·짝퉁·가품·비정품·정품 아님   전부 0
#
# ⚠ 0건인 낱말은 **넣지 않는다.** 표본에 없는 것을 넣으면 오탐만 열어 두는
#   것이고, 이 저장소가 별칭에서 여러 번 겪은 모양이다.

version: 1
잰날: "2026-09-14"
코퍼스:
  도매꾹_제목: 18938
  새표본: 235

표지어:
  - key: "호환"
    # 낱말 그대로 찾는다. 한국어 부분 문자열이라 단어 경계가 없지만, '호환' 을
    # 품은 다른 낱말이 표본 19,173줄에 없었다(전수 확인).
    패턴: "호환"
    실측:
      도매꾹: 44
      새표본: 1
      진짜_예:
        - "스마트워치 밴드 … 갤럭시워치 호환 소품 용품"
        - "펌프 헤드 대용량 공병 세타필 크림 호환 펌핑기"
        - "[클럭 호환용] 마사지패드 (대형) 3장 리필"
        - "키스킨 투명 키보드 덮개 로지텍 K380 S 호환 실리콘 커버"
      오탐_예:
        # 일반 규격 호환. 브랜드가 아니라 인터페이스를 말한다.
        - "to C타입 전송 연결 USB 호환 노트북 데이터"
        - "프리미엄 휴대폰 방수케이스 4중잠금 수중터치 전기종 호환"
        - "리클라이너 의자 쿠션 방석 접이식침대의자 호환가능"
        - "좌욕기 리본대야 셀프사용 변기 호환 간편한 온수좌욕"
      비고: >
        45건 중 눈으로 센 브랜드 호환 표기가 약 27건, 일반 규격 호환이 약 18건.
        안내 축이라 오탐 비용이 낮다 - 검증을 끄지도 등급을 붙이지도 않고
        "상표·디자인권은 확인하지 않습니다" 라는 사실을 한 줄 더 말할 뿐이다.

  - key: "st"
    # ⚠ **한글 바로 뒤의 st 만.** 띄어 쓴 'ST' 는 모델 번호가 3/4 였다.
    #   'best' · 'first' 처럼 영문 낱말 속 st 도 막는다.
    패턴: "[가-힣][sS][tT](?![A-Za-z0-9])"
    정규식: true
    실측:
      도매꾹: 4
      새표본: 0
      진짜_예:
        - "이지심플 책상 보조 선반/서랍 미니선반/이케아st"
        - "[당일출고]베이직st 신발 방수커버 레인슈즈"
        - "우드st 조립식 베란다 바닥 데크타일 초코브라운"
        - "붉은조각 목검 애니st 코스프레 플라스틱칼"
      오탐_예: []
      비고: >
        한글 바로 뒤 형태는 표본에서 오탐 0 이었다. 넷 다 "…풍/스타일" 뜻으로
        쓰였고 그중 '이케아st' 가 브랜드다.

# 근거 원문. 둘 다 2026-09-14 에 **본문 <title> 로** 확인했다 -
# law.go.kr 은 없는 주소에도 200 을 준다.
근거:
  상표법:
    label: "상표법 (법률) · law.go.kr"
    url: "https://www.law.go.kr/법령/상표법"
    확인: "2026-09-14 · <title>상표법</title>"
  kipris:
    label: "KIPRIS 상표 검색"
    url: "https://www.kipris.or.kr/khome/search/searchResult.do?tab=trademark"
    확인: "2026-09-14 · <title>홈 > 지식재산정보 검색 > 상표 검색</title> · 상표 탭 활성"
    # ⚠⚠ **검색어를 주소에 담지 않는다. 재 봤고 안 된다 (R5).**
    #
    #   KIPRIS 검색 폼은 `searchResult.do` 로 **POST** 한다. 실측 셋:
    #     ?queryTextTop=완구            뒤쪽 검색칸은 채워지지만 탭이 특허이고
    #                                   결과가 안 돈다(검색 팁 화면)
    #     ?tab=trademark&queryTextTop=완구  상표 상세검색 창이 뜨는데 그 창의
    #                                   자유검색 칸은 **비어 있다**
    #     ?tab=trademark                상표 검색 창이 바르게 뜬다  ← 이것을 쓴다
    #
    #   검색어가 반쯤 들어가는 주소를 쓰면 셀러가 "검색된 줄" 알고 빈 화면을
    #   읽는다. 대신 화면이 상품명을 복사할 수 있게 둔다.
