# 소관 안내 매핑 — [L-1] · 2026-09-13
#
# ⚠⚠ **판정이 아니다. 안내 축이다.**
#   신호등을 바꾸지 않는다 · 등급을 붙이지 않는다 · 다섯 숫자를 움직이지 않는다.
#   문구는 "○○법 소관으로 보입니다 — 해당 기관 확인 필요" 까지다.
#   "판매 불가"·"허가 필요" 는 §9 단정 금지 위반이다.
#
# ⚠ 이 파일은 **텍스트 편집만** 한다. `yaml.safe_dump` 으로 덮어쓰지 않는다 -
#   주석이 자산이다 (CLAUDE.md §6). hazard_rules.yaml 에서 주석 113줄을 날린 적이 있다.
#
# ⚠⚠ **표지어는 별칭과 같은 성질이다 — 매칭을 넓힌다.** 그래서 크레파스 원칙:
#   실측에서 걸린 것만 넣고 **걸린 수와 오탐 예를 같이 적는다.**
#   그리고 `OUT_OF_SCOPE` 는 **인증·리콜 검증을 통째로 건너뛴다.** 오탐 하나가
#   리콜된 상품을 놓치게 만든다 - 넓히기 전에 반드시 두 코퍼스로 잰다.
#
