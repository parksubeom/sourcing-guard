# ── 넣지 않은 후보 ──────────────────────────────────────────────
#
# ⚠⚠ **재고 안 넣었다.** 근거가 없거나 오탐이 나왔다 (2026-09-13 실측).
#
#   기후에너지환경부 · 「생활화학제품 및 살생물제의 안전관리에 관한 법률」
#     (제3조 정의 · 시행 20260701 · https://www.law.go.kr/법령/생활화학제품및살생물제의안전관리에관한법률)
#     '모기향'   도매꾹 10 · 표본 1 → **[7] 헨켈 홈매트 전자모기향 본체 = 대상(전기용품)**
#     '훈증기'   도매꾹  2 · 표본 2 → [4] 리필 비대상 / **[7] 본체 대상** — 같은 말이 갈린다
#     '살충제'·'탈취제'·'방향제'·'제습제'·'살균제'·'표백제'·'방충제'·'습기제거제'
#                도매꾹 2~49 · **표본 전부 0건** → 크레파스 원칙상 넣지 않는다
#     ⚠ 리필(소모품)은 환경부 소관이고 **본체는 전기용품**이다. 표지어로는 못 가른다.
#
#   국토교통부 · 자동차관리법
#     '카시트' 도매꾹 19 · 표본 6 **전부 비대상**   '킥매트' 1/1 비대상
#     '룸미러'  5/1 비대상                        '안전벨트' 11/2 비대상
#     ⚠ **근거는 충분한데 부작용이 크다.** OUT_OF_SCOPE 는 인증·리콜 검증을
#       통째로 건너뛴다. 자동차용품에도 리콜이 공표되므로, 소관 안내 한 줄을
#       주려고 리콜 대조를 끄는 것은 R6("놓친 리콜이 불필요한 안내보다 비싸다")
#       와 맞바꾸는 일이다. **총괄 판단이 필요하다** - 미완에 적었다.
#     ⚠ '카시트' 는 이미 `item_grades.CHILD_MARKER_EXCLUSIONS` 에서 쓰고 있다.
#       거기서는 **어린이 표지어를 못 믿는다**는 뜻이고 검증을 끄지 않는다.
#       같은 낱말이지만 하는 일이 다르다.
#
#   농림축산식품부 · 사료관리법 / 농림축산검역본부 · 검역
#     '사료'  도매꾹 12 → "사료스푼·사료스쿱" (용구)      '생물' 5 → "해양생물10종 미니블록" (완구)
#     '검역'   1 → "식약처검역완료 … 대나무 칫솔" (표기)   '묘목' 1 → "케이티 묘목 매트"
#     ⚠ **전부 오탐이다.** 표본 0건이고 도매꾹에서도 다른 품목에 걸린다.
#
