    #   부작용이 크다 - OUT_OF_SCOPE 는 리콜 대조를 통째로 끈다" 고 적고
    #   총괄 판단을 기다렸다. 2026-09-14 에 `mode: notice` 로 열렸다 -
    #   인증·리콜 대조는 그대로 하고 소관 안내 한 줄만 붙인다.
