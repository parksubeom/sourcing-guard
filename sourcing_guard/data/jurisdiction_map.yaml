# 소관 안내 매핑 — [L-1] · 2026-09-13
#
# ⚠⚠ **판정이 아니다. 안내 축이다.**
#   신호등을 바꾸지 않는다 · 등급을 붙이지 않는다 · 다섯 숫자를 움직이지 않는다.
#   문구는 "○○법 소관으로 보입니다 — 해당 기관 확인 필요" 까지다.
#   "판매 불가"·"허가 필요" 는 §9 단정 금지 위반이다.
#
# ⚠ 이 파일은 **텍스트 편집만** 한다. `yaml.safe_dump` 으로 덮어쓰지 않는다 -
#   주석이 자산이다 (CLAUDE.md §6). hazard_rules.yaml 에서 주석 113줄을 날린 적이 있다.
#
# ⚠⚠ **표지어는 별칭과 같은 성질이다 — 매칭을 넓힌다.** 그래서 크레파스 원칙:
#   실측에서 걸린 것만 넣고 **걸린 수와 오탐 예를 같이 적는다.**
#   그리고 `OUT_OF_SCOPE` 는 **인증·리콜 검증을 통째로 건너뛴다.** 오탐 하나가
#   리콜된 상품을 놓치게 만든다 - 넓히기 전에 반드시 두 코퍼스로 잰다.
#
# 실측 코퍼스 (2026-09-13)
#   도매꾹 제목 18,938  tests/fixtures/도매꾹_표본_2026-09-12/상품명.tsv
#   새표본      235     tests/fixtures/새표본235_대상분류.tsv
#
# 법령 원문·소관 부처는 law.go.kr DRF 로 받아 확인했다 (R5).
#   재현: python scripts/probe_jurisdiction_laws.py
#
# ⚠ 2026-09-14 정정 둘. (1) 그 스크립트는 **그때 없었다** - 이 줄이 문서가
#   코드보다 앞서 나간 자리다. 이제 실재한다. (2) `SG_LIVE_NET=1` 을 붙여
#   적었는데 그 변수는 **pytest 안에서만** 의미가 있다 - 스크립트를 직접
#   돌릴 때는 아무 효과가 없는 주문이었다.

# ── mode — 안내가 검증을 끄는가 (2026-09-14 · 총괄 판단) ──────────────
#
#   out_of_scope   (기본) 표지어가 걸리면 **인증·리콜 검증을 통째로 건너뛴다.**
#                  표지어는 `scoping.OUT_OF_SCOPE_HINTS` 에 있다. 오탐 하나가
#                  리콜된 상품을 놓치게 하므로 하드 신호만 넣는다.
#   notice         검증을 **켠 채로 안내만** 붙인다. 표지어는 이 파일의
#                  `표지어_안내` 에 있고, `jurisdiction_notice` finding 이 된다.
#                  신호·등급·다섯 숫자를 건드리지 않으므로 오탐 비용이 낮다.
#
# ⚠ 한 소관이 둘 다 가질 수 있다. 화장품이 그렇다 - '화장품책임판매업자'·
#   'EWG' 같은 하드 신호는 out_of_scope 로 두고, 낱말 '화장품' 하나만
#   notice 로 옮겼다(아래 실측 참조).

