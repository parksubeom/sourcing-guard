# SafetyKorea Open API 필드 매핑
#
# 근거: 「Open API 인터페이스 설계서 v2.0」(2025-06-30, 국가기술표준원).
# 아래 값은 전부 설계서 원문에서 확인한 것이다. 추측으로 채운 값은 없다 (CLAUDE.md R5).
# 각 항목에 원문 페이지를 주석으로 남긴다.
#
# 설계서에서 확인된 사실:
#   - 인증은 HTTP 헤더 `AuthKey`, 대소문자 구분 (p.2). 쿼리 파라미터가 아니므로
#     이 파일에 service_key 항목이 없다. kats_client 가 헤더로 보낸다.
#   - 응답 포맷은 URL 확장자로 정한다 (`.json` / `.xml`). type 파라미터가 아니다 (p.2).
#   - 페이지 크기/번호 파라미터가 없다 (p.2).
#
#   ⚠ "모든 조회목록은 최대 1,000 줄까지만 제공됩니다"(p.2)는 실측과 다르다.
#     2026-09-01 실측: conditionKey=all & conditionValue=%
#       국내 recall/recallList.json   4,243건
#       국외 recall/fRecallList.json 33,070건
#     둘 다 단일 응답으로 왔다. 상한이 실재하지 않거나 훨씬 높다.
#     따라서 날짜를 잘라 대량 수집하는 설계는 불필요하다. 아래 limits 참조.
#   - 평문 HTTP. HTTPS 페이지에서 브라우저가 직접 호출 불가(mixed content) → 백엔드 경유.
#   - 결과코드: 2000 성공 / 2004 No Data / 4000 Invalid Auth Key / 4001 Invalid IP /
#     4005 Invalid Parameter / 5000 Internal Server Error (p.19).
#
# 반영 완료:
#   - certState 는 존재가 아니라 유효성이다. 상태값 10가지 중 '적합'만 유효하다.
#     아래 cert_states 참조 (p.5, p.8).
#   - recallModelName 과 certNum 은 콤마로 묶인 목록이다 (p.11, p.14).
#     kats_client.split_list_field() 가 분해한다.
#   - 국내/국외에서 accidentCaseDscr 의 뜻이 다르다. 국내=위해정보(p.14),
#     국외=소비자 행동요령(p.17). 같은 이름이지만 다른 필드다.

verified: true
verified_source: "Open API 인터페이스 설계서 v2.0 (2025-06-30)"
verified_at: "2026-08-31"
verified_note: "설계서 원문 대조 완료. 실응답 검증은 인증키 수령 후."

# 공통. 확장자가 응답 포맷을 정하므로 경로에 .json 이 포함되어 있다.
# 실측으로 확인한 조회 한계와 사용법. 설계서 기재와 다른 부분이 있어 따로 둔다.
limits:
  verified_at: "2026-09-01"
  spec_says_max_rows: 1000        # 설계서 p.2 "모든 조회목록은 최대 1,000 줄까지만 제공됩니다"
  observed_max_rows: 33070        # 실측: 국외 리콜 전량이 단일 응답
  observed:
    recall_domestic: 4243
    recall_overseas: 33070
  note: >-
    상한이 실재하지 않거나 훨씬 높다. 날짜 슬라이스는 불필요하다.
  full_dump_cost:                 # 실측 2026-09-01
    recall_domestic: "5.42 MB / 2.0초"
    recall_overseas: "32.84 MB / 5.7초"

  # 전량 조회는 conditionKey=all + conditionValue=% 다.
  #
  # ⚠ conditionValue 를 비우면 전량이 아니라 4005(Invalid Parameter)다.
  #   "전체 조회는 값을 비우면 되겠지" 가 통하지 않는다. 와일드카드 % 를 넣어야 한다.
  #
  # ⚠ 설계서에 명시된 사용법이 아니다. conditionValue 는 검색어 자리인데
  #   와일드카드로 전량을 받는 것이다. 신청서 안내문에 "개발 명세서 포맷을
  #   어길 시 별도 통보 없이 인증이 취소될 수 있다" 고 되어 있으므로,
  #   초기 적재 1회에만 쓰고 반복 호출에는 쓰지 않는다.
  full_dump:
    condition_key: "all"
    condition_value: "%"
    empty_value_result: "4005"

  # conditionValue 는 접두 부분 매칭이 된다. 범위 문법(~ - ,)은 안 된다.
  #   publishDate=20260723        53건   (날짜 하나)
  #   publishDate=202607          55건   (그 달 전체)
  #   publishDate=2026           116건   (그 해 전체)
  #   publishDate=20260101~20260901   0건 — 범위 문법은 통하지 않는다
  #
  # 월 단위 조회가 가볍다(2026-08 기준): 국내 2건 3KB, 국외 253건 398KB, 0.2초.
  # 일일 동기화는 이걸 쓴다. all=% 전량(38MB)을 매일 받을 이유가 없다.
  prefix_match:
    supported: true
    examples: ["20260723", "202607", "2026"]
    range_syntax_supported: false   # 20260101~20260901 -> 0건

  # 정렬은 스코프마다 다르다. 국내 응답의 정렬을 신뢰하면 안 된다.
  ordering:
    recall_domestic: "정렬 보장 없음"
    recall_overseas: "publishDate 내림차순"

base_url: "http://www.safetykorea.kr/openapi/api"

operations:
  # p.3 — KC인증정보 조회
  certification:
    path: "cert/certificationList.json"
    rows_path: ["resultData"]
    params:
      condition_key: "conditionKey"
      query: "conditionValue"
    # conditionKey 로 검색 대상을 고른다 (p.3):
    #   all / certNum / productName / modelName / certDate / signDate
    condition_keys:
      all: "all"
      cert_number: "certNum"
      product_name: "productName"
      model_name: "modelName"
    defaults:
      conditionKey: "certNum"
    fields:                      # p.5 응답 메시지 명세
      cert_number: "certNum"
      product_name: "productName"
      model_name: "modelName"
      maker: "makerName"
      status: "certState"        # 존재가 아니라 유효성. cert_states 참조
      detail_url: ""             # 응답에 없다. kats_client 가 searchPop URL 을 만든다
      brand_name: "brandName"
      category_name: "categoryName"
      maker_country: "makerCntryName"
      importer: "importerName"
      import_div: "importDiv"
      cert_div: "certDiv"        # 전안법/어린이법의 안전인증·안전확인 대상 구분
      cert_date: "certDate"

  # p.9 — 국내리콜정보 조회
  recall_domestic:
    path: "recall/recallList.json"
    rows_path: ["resultData"]
    params:
      condition_key: "conditionKey"
      query: "conditionValue"
    # p.9: all / barcodeNum / recallProductName / recallBrandName /
    #      recallModelName / certNum / publishDate
    condition_keys:
      all: "all"
      product_name: "recallProductName"
      model_name: "recallModelName"
      cert_number: "certNum"
      published_on: "publishDate"
    defaults:
      conditionKey: "recallModelName"
    fields:                      # p.11, p.14 응답 메시지 명세
      product_name: "recallProductName"
      model_name: "recallModelName"   # 콤마 구분 목록
      maker: "makerName"
      reason: "harmDscr"              # 제품 결함
      announced_on: "publishDate"     # yyyyMMdd
      detail_url: ""                  # 응답에 없다. recallUid 로 상세 조회 가능
      cert_numbers: "certNum"         # 콤마 구분 목록
      brand_name: "recallBrandName"
      recall_type: "recallTypeName"
      action_guide: "publishActionDscr"  # 국내: 소비자 행동요령 (p.14)
      uid: "recallUid"

  # p.15 — 국외리콜정보 조회
  recall_overseas:
    path: "recall/fRecallList.json"
    rows_path: ["resultData"]
    params:
      condition_key: "conditionKey"
      query: "conditionValue"
    # p.15: all / recallProductName / recallBrandName / recallModelName /
    #       publishDate / fRecallUid
    condition_keys:
      all: "all"
      product_name: "recallProductName"
      model_name: "recallModelName"
      published_on: "publishDate"
    defaults:
      conditionKey: "recallModelName"
    fields:                      # p.17 응답 메시지 명세
      product_name: "recallProductName"
      model_name: "recallModelName"
      maker: "makerName"
      reason: "violateDscr"           # 위해내용. 국내의 harmDscr 과 이름이 다르다
      announced_on: "publishDate"
      detail_url: "recallUrl"         # 국외는 원문 URL 이 응답에 있다
      brand_name: "recallBrandName"
      recall_type: "recallTypeName"
      # ⚠ 국외에서는 accidentCaseDscr 가 소비자 행동요령이다 (p.17).
      #   국내(p.14)에서는 같은 이름이 위해정보다. 섞으면 엉뚱한 문구가 나간다.
      action_guide: "accidentCaseDscr"
      uid: "fRecallUid"

# p.5 / p.8 — certState 열거값과 신호등 매핑.
#
# 조회 성공은 유효성이 아니다. 취소·효력상실·사용금지 상태의 인증번호는 조회는
# 되지만 그 인증으로 판매 표시를 유지할 수 없으므로, 인증이 아예 없는 것과
# 실질이 같다. 따라서 RED 다.
#
# 문자열은 설계서 표기 그대로여야 한다. 한 글자만 달라도 classify_cert_state()
# 가 조용히 UNKNOWN 으로 떨어지고, 취소된 인증이 RED 가 아니게 된다.
# ⚠ 실연동으로 확인된 실제 분포 (완구 인증 144,738건, 2026-09-01):
#      기간만료 96,275 (67%) / 적합 48,347 (33%) / 효력상실 41 / 반납 27 /
#      안전인증취소 3 / 취소 1 / '-' 43
#
#    기간만료가 3분의 2다. 이걸 revoked(RED) 에 두면 정상 상품에 빨간불이
#    반복되고, 셀러가 모든 RED 를 무시하게 된다 (CLAUDE.md R3-b).
#    기간만료는 "문제가 있다" 가 아니라 "수명이 끝났다" 이고, 재인증되면
#    번호 뒤에 문자가 붙는다 — 실측: JU071047-12002 → JU071047-12002C.
#    반납도 마찬가지다. 실제 사유가 "반납_인증기관은 FITI 시험연구원으로
#    변경됨" 처럼 순수 행정 사유였다.
#
#    RED 는 정부 DB 가 문제를 적어둔 경우에만 준다. 처벌은 certChgReason 에
#    법 조항이 적힌다 — "어린이제품법 21조1항2호_시판품 부적합(최중결함)".
cert_states:
  ok: ["적합"]
  # "취소" 는 설계서 열거값에 없지만 실데이터에 있다(완구 1건, 어린이 2건).
  # certChgReason 이 None 이라 안전인증취소와 같은 것인지 확답은 못 하지만,
  # UNKNOWN 으로 두면 진짜 취소된 인증이 조용히 통과한다 — 이 프로젝트가
  # 가장 비싸다고 규정한 오류다. 20만건 중 3건이라 오탐 위험도 사실상 없다.
  revoked: ["안전인증취소", "안전확인신고 효력상실", "취소"]
  expired: ["기간만료", "반납"]
  suspended:
    - "안전인증표시 사용금지 2개월"
    - "안전인증표시 사용금지 4개월"
    - "안전확인신고표시 사용금지 2개월"
  under_action: ["개선명령", "청문실시"]

  # 상태가 아니라 "값이 없다" 는 뜻이다 (완구 43건). 판정은 UNKNOWN 으로 같지만
  # 문구는 갈라야 한다 — "해석하지 못했습니다" 는 우리 잘못처럼 들린다.
  # 위 다섯과 달리 CertState 버킷이 아니므로 classify 순회 대상이 아니다.
  cert_state_not_stated: ["-", "", "없음", "해당없음", "해당사항없음", "N/A"]

# p.18 — URL 링크. 인증키가 필요 없어서 근거 링크(R2)로 쓴다.
public_urls:
  # 인증번호별 상세 팝업. 근거 링크(R2)는 이것 하나만 쓴다.
  cert_detail: "http://www.safetykorea.kr/search/searchPop?certNum={cert_number}"
  # 제품명·업체명으로 인증 여부를 직접 검색하는 페이지. 인증번호가 없을 때
  # 셀러를 여기로 보내 스스로 확인하게 한다 (우리는 판정하지 않는다, R1).
  # GET 파라미터 실측 완료 (2026-09-01, 프로덕션). 같은 URL 두 번 호출 시 응답
  # 차이가 0줄이라 아래 차이는 전부 실제 효과다.
  #
  #   searchWord / itemName / keyword / searchKeyword / prdtNm / certNum
  #       → 무시된다. 응답이 파라미터 없는 경우와 같다(요청 카운터 1줄 제외).
  #   pageNo=2          → 먹는다. 목록 246줄이 바뀌고 다른 인증번호가 나온다.
  #   categoryCode3=01  → hidden 필드에 echo 되지만 목록이 0행이다.
  #                        01·03·41·42 모두 0행 — 3단계 코드 체계를 모르면
  #                        빈 화면으로 셀러를 보내게 된다. 추측해 넣지 않는다(R5).
  #
  # 결론: 검색어를 붙일 방법이 없다. 이 페이지에 키워드 입력 필드 자체가 없고
  # (폼은 categoryCode3·pageNo 뿐), 키워드 검색은 certificationsearch 에 있는데
  # 그건 POST 전용이라 GET 으로 열면 405 다(아래 unusable_urls). 그래서 순수
  # 링크로 두고 검색어는 화면 문구로 안내한다.
  item_search: "https://www.safetykorea.kr/release/itemSearch"

# ⚠ 아래 두 주소는 근거 링크로 쓰지 않는다. 기록용으로만 남긴다.
#
#   certificationsearch : 설계서 p.18 "인증번호 검색 (신)" 이지만 실측 결과
#                         GET 에 405 를 돌려준다. 셀러가 클릭하면 오류 화면을 본다.
#   release/certDetail  : 실측 200 이지만 설계서에 없는 주소다. 문서화되지 않은
#                         엔드포인트는 예고 없이 바뀌고, 파라미터가 없어 특정
#                         인증번호를 가리키지 못한다. 근거가 아니라 안내에 그친다.
unusable_urls:
  cert_search_405_on_get: "http://www.safetykorea.kr/release/certificationsearch"
  cert_detail_undocumented: "https://www.safetykorea.kr/release/certDetail"

# p.19 — 결과 코드
result_codes:
  "2000": "Success"
  "2004": "No Data"
  "4000": "Invalid Auth Key"
  "4001": "Invalid IP"
  "4005": "Invalid Parameter"
  "5000": "Internal Server Error"
