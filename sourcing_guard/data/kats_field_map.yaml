# SafetyKorea Open API 필드 매핑
#
# 근거: 「Open API 인터페이스 설계서 v2.0」(2025-06-30, 국가기술표준원). 원문 대조 완료.
#
# 설계서에서 확인된 사실 (핸드오프 §4):
#   - 인증은 HTTP 헤더 `AuthKey`. 쿼리 파라미터가 아니고 대소문자를 구분한다.
#     → 그래서 이 파일에 service_key 파라미터명이 없다. kats_client 가 헤더로 보낸다.
#   - IP 제한이 있다. 등록되지 않은 IP 는 결과코드 4001 Invalid IP.
#   - 평문 HTTP. 브라우저에서 직접 호출 불가(mixed content). 반드시 백엔드 경유.
#   - 목록 조회는 최대 1,000줄이고 페이징 파라미터가 없다.
#     대량 수집은 conditionKey=publishDate 로 날짜를 잘라서 한다.
#   - recallModelName 과 certNum 은 콤마로 묶인 목록이다. 통짜 비교하면 다중 모델
#     리콜을 전부 놓친다.
#   - certState 는 존재가 아니라 유효성이다. 조회됐다고 초록불을 주면 안 된다.
#
# ⚠ 아래 경로·필드명은 아직 미검증입니다 (CLAUDE.md R5).
# 인증키 수령 후 다음 절차로 채웁니다.
#
#   1) python scripts/probe_kats_schema.py --base-url <설계서의 호스트> --path <경로>
#      → 실제 응답 구조와 필드 후보를 출력합니다
#   2) 출력된 후보를 설계서와 대조해 TODO 를 교체하고 verified 를 true 로
#
# 값을 추측해서 채우지 마세요. 채우기 전까지는 MOCK_MODE 로 개발합니다.

verified: false

