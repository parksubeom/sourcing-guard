<!-- 제목용 Pretendard. 버전을 박는다 - 안 박으면 최신이 바뀔 때
     화면이 말없이 달라진다. 경로 근거는 CLAUDE.md R4 참조. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<!--
  체험 표본. 스타일은 app.css 의 "체험 표본" 절에만 있다 - 페이지 전용 style
  태그를 여기 두지 않는다 (검사가 막는다).

  주의(중요): **문구와 숫자를 여기 적지 않는다.** 전부 /api/v1/samples 가 그린다.
    카드의 모든 문장은 우리 서버가 실제로 낸 /api/v1/scan 응답 그대로이고
    (scripts/record_samples.py 가 받아 둔 것), 정직 문구의 다섯 숫자는
    baseline.BASELINE 에서 온다. 화면에 박으면 기준선이 움직일 때 한쪽만
    고쳐진다.

  주의(중요): 기록본이지 실시간 검사가 아니다. 그래서 카드마다 "지금 다시 검사"
    가 있고, 그것은 /scan?sample=<번호> 로 가서 **일반 예산 안의** 검사를 돈다.
    표본을 면제 지문으로 늘리면 투표 18일 동안 상한 없는 호출이 된다.
-->
</head>
<body class="lv2">
<a class="skip" href="#main">본문으로 건너가기</a>

<header class="masthead">
  <div class="container">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><use href="/static/mascot.svg#ansimi-GREEN"/></svg>
      <span class="wordmark">안심 소싱 돋보기</span>
    </a>
    <nav class="pages" aria-label="주요 화면">
      <a href="/">소개</a>
      <a href="/scan">상품 검사</a>
      <a href="/batch">대량 검사</a>
      <a href="/watch">감시 목록</a>
      <a href="/guide">다루는 범위</a>
    </nav>
    <!-- 리콜 공표 기준일. 서버가 `_fill_as_of` 에서 한 곳으로 박는다 -
         화면마다 물어보면 같은 판단이 일곱 벌이 된다 (§6). 값이 없으면
         이 요소째 사라진다. -->
    <span class="asof" data-asof></span>
  </div>
</header>

<div class="intro">
  <div class="container intro-grid">
    <div class="intro-say">
      <!-- 주의(중요): 칩은 **내용이 어떻게 만들어졌는지**를 말한다.
           페이지 이름("체험 표본")을 쓰면 바로 아래 제목과 같은 글자가
           되고, 같은 말을 20px 간격으로 두 번 쓰면 결함으로 보인다.
           칩은 "여기가 어디인가", 제목은 "여기서 뭘 하나" 인데 이
           화면들은 둘이 같아서, 칩이 **한 겹 더 뒤**를 말한다.
           검사가 "칩이 제목과 같으면 실패" 를 단정한다. -->
      <span class="eyebrow">기록본 · 기간만료·취소 포함</span>
      <h1>체험 표본</h1>
      <p class="sx-lede">도매 실상품 열 개를 <strong>저희가 실제로 검사한 결과 그대로</strong>입니다.
    인증번호가 상세페이지에 적혀 있는 상품만 골랐고, 그중에는
    <strong>인증이 기간만료되었거나 취소된 것</strong>도 있습니다.</p>
    </div>
    <!-- 마스코트. 장식이므로 스크린리더에서 뺀다.
         주의(가장 중요): **신호 스프라이트를 쓰지 않는다.** `ansimi-GREEN` 을
           히어로에 쓰면 「우리가 틀린 것」 화면에 초록 얼굴이 뜬다 - id 가 곧
           신호라서 생기는 사고다. 히어로는 `ansimi-look`(신호 없음)이나
           `/static/hero/*.png` 만 쓴다. 검사가 그것을 단정한다. -->
    <div class="intro-art" aria-hidden="true"><!-- 주의(중요): 스프라이트(`mascot.svg#ansimi-look`)를 쓰다가 그림
           자산으로 바꿨다 (2026-09-21). 스프라이트 자산은 130x162 라
           320px 에 쓰면 2.5배 확대다. 히어로에서 `mascot.svg` 의존이
           빠졌고, 결과 카드의 `ansimi-*` 는 그대로다. --><div class="intro-face art" style="--art:url(/static/hero/default.png);--art2:url(/static/hero/default@2x.png)"></div></div>
  </div>
</div>

    <p class="row"><span>데이터 · 국가기술표준원 · 제품안전정보센터 · 국가법령정보센터</span><span>안심 소싱 돋보기</span></p>
